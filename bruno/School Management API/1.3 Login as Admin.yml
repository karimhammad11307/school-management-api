info:
  name: 1.3 Login as Admin
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  auth: none
  body:
    type: json
    data: |-
      {
        "email": "admin@school.local",
        "password": "Admin123!"
      }

script:
  res: |-
    if (res.status === 200 && res.body.accessToken) {
      bru.setVar("token", res.body.accessToken);
      bru.setEnvVar("token", res.body.accessToken);
    }
