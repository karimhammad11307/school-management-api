info:
  name: 3.2 Create Class 2
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/classes"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Science 202",
        "capacity": 5,
        "teacherId": "{{teacherId}}"
      }

script:
  res: |-
    if (res.status === 201 && res.body.id) {
      bru.setVar("class2Id", res.body.id);
      bru.setEnvVar("class2Id", res.body.id);
    }
